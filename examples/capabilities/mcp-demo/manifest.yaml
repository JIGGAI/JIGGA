name: mcp-echo
version: 0.1.0
summary: Demo mcp_server that echoes tool-call arguments via JSON-RPC over stdio.
type: mcp_server
actions:
  - demo.echo
  - demo.upper
command: python
args:
  - server.py
permissions:
  network:
    mode: deny
# Local stdio echo with no network use — risk_level matches actual surface
risk_level: low
