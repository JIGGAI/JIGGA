id: social_content_syndication
name: Social Content Syndication
purpose: Convert one source idea or asset into platform-specific content drafts.
status: draft
trigger:
  manual: true
inputs:
  source_material:
    type: file_or_text
    required: true
steps:
  - id: extract_core_message
    agent: content_strategist
    action: extract_core_message
    output: core_message.md
    approval: not_required
  - id: draft_linkedin
    agent: linkedin_writer
    action: draft_linkedin_post
    input:
      core_message: core_message.md
    output: linkedin_post.md
    approval: not_required
  - id: draft_x_thread
    agent: x_writer
    action: draft_thread
    input:
      core_message: core_message.md
    output: x_thread.md
    approval: not_required
  - id: draft_newsletter
    agent: newsletter_writer
    action: draft_blurb
    input:
      core_message: core_message.md
    output: newsletter_blurb.md
    optional: true
    approval: not_required
  - id: editorial_review
    agent: editor
    action: review_tone_and_claims
    input:
      files:
        - linkedin_post.md
        - x_thread.md
        - newsletter_blurb.md
    output: editorial_notes.md
    approval: not_required
  - id: prepare_distribution
    agent: publisher
    action: prepare_distribution_package
    approval: required
outputs:
  - linkedin_post.md
  - x_thread.md
  - newsletter_blurb.md
  - editorial_notes.md
memory:
  write_summary: true
  write_raw: true
permissions:
  required:
    - filesystem.read
    - filesystem.write
