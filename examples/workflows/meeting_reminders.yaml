id: meeting_reminders
name: Meeting Reminders
purpose: Notify the user before meetings and optionally include prep context.
status: approved
trigger:
  event: calendar.event_upcoming
  offsets:
    - 30m
    - 5m
steps:
  - id: load_event
    agent: daily_briefing_agent
    action: calendar.get_event
    output: event_details
    approval: not_required
  - id: gather_prep_context
    agent: meeting_prep_agent
    action: summarize_relevant_context
    input:
      event: event_details
    output: prep_notes
    optional: true
    approval: not_required
  - id: notify
    agent: daily_briefing_agent
    action: notifications.send
    input:
      include:
        - title
        - time
        - location_or_link
        - attendees
        - prep_notes
    approval: not_required
outputs:
  - meeting_notification
memory:
  write_summary: false
  write_raw: false
permissions:
  required:
    - calendar.read
    - notifications.send
