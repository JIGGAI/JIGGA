[project]
name = "jigga"
version = "0.1.0"
description = "Local-first operating system for personal AI workers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JIGGA" }]
keywords = ["agents", "ai", "local-first", "automation", "cli", "supervisor"]
dependencies = [
  "PyYAML>=6.0.2"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/JIGGAI/JIGGA"
Repository = "https://github.com/JIGGAI/JIGGA"
Issues = "https://github.com/JIGGAI/JIGGA/issues"

[project.scripts]
jigga = "jigga.cli:main"

[tool.ruff]
line-length = 110
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jigga"]

# The bundled recipes live in the top-level `examples/` (read at runtime via
# `examples_dir()`). Ship them INSIDE the wheel as `jigga/examples` so a
# pip-installed JIGGA still finds `jigga recipes` / `init --examples`.
[tool.hatch.build.targets.wheel.force-include]
"examples" = "jigga/examples"

[tool.hatch.build.targets.sdist]
include = ["jigga", "examples", "README.md", "LICENSE", "pyproject.toml"]
