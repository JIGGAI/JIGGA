name: Publish to PyPI

# Builds the sdist + wheel and publishes to PyPI when a GitHub Release is
# published (tag the release, e.g. v0.1.0). Uses PyPI Trusted Publishing
# (OIDC) — no API token stored in GitHub. One-time setup on PyPI:
#   PyPI → project "jigga" → Publishing → add a GitHub trusted publisher:
#     owner: JIGGAI   repo: JIGGA   workflow: publish.yml   environment: pypi
# (For the very first upload, add it as a "pending publisher" before the project
# exists.) To use an API token instead, drop the `permissions:`/`environment:`
# blocks and pass `password: ${{ secrets.PYPI_API_TOKEN }}` to the publish step.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
