name: gog
version: 0.1.0
summary: Google Workspace (Gmail, Calendar, Drive, Sheets...) via the gogcli tool.
type: native
actions:
  - gog.gmail_search
  - gog.gmail_get
  - gog.gmail_draft
  - gog.gmail_send
  - gog.calendar_events
  - gog.calendar_create
  - gog.drive_list
  - gog.drive_get
  - gog.drive_share
  - gog.sheets_get
  - gog.sheets_append
  - gog.docs_get
  - gog.docs_write
permissions:
  network:
    mode: allow
    target: https://www.googleapis.com
risk_level: medium
handler: runtime.gog
