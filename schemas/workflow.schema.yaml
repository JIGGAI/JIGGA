# JIGGA Workflow Schema Draft
id: string
name: string
purpose: string
status: draft|suggested|planned|approved|active|paused|deprecated|archived
trigger:
  schedule: string
  event: string
  manual: boolean
inputs:
  key:
    type: string
    required: boolean
steps:
  - id: string
    agent: string
    action: string
    input: object
    output: string
    approval: required|not_required
    optional: boolean
    on_fail:
      action: string
      target: string
# --- v2 (DAG) form: declare `nodes` + `edges` INSTEAD of `steps`. ---
# tool: a capability action (like a v1 step). llm: sugar for draft_with_model.
# human_approval: parks the run until `approve <code>` on the user's channel.
# writeback: copy a named upstream output to a file under ~/.jigga/workspaces/.
nodes:
  - id: string
    type: tool|llm|human_approval|writeback
    agent: string
    action: string        # required for tool; llm defaults to draft_with_model
    input: object         # writeback: {source|value, path}; human_approval: {prompt}
    output: string
    optional: boolean
# Edges route the graph. `on` defaults to success; error edges are how a
# failure is handled (an unhandled node failure fails the run).
edges:
  - from: string
    to: string
    on: success|error|always
outputs:
  - string
memory:
  write_summary: boolean
  write_raw: boolean
permissions:
  required:
    - string
